AWSTemplateFormatVersion: 2010-09-09

Description: >
  Pellier - Aurora PostgreSQL Serverless v2 with pgvector 0.8.1.
  Engine version is parameter-driven (default 18.3) so the stack bumps
  cleanly before each event. All access uses the Secrets Manager
  credential - the backend over psycopg, the tool Lambdas over the
  RDS Data API.

Parameters:
  WorkshopId:
    Type: String
    AllowedPattern: ^[a-z0-9][a-z0-9-]{2,40}$

  EventName:
    Type: String
    Default: dat416-governed
    AllowedPattern: ^[a-z0-9][a-z0-9-]{2,63}$
    Description: Event-neutral tag applied to workshop resources.

  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id

  AuroraSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  AuroraEngineVersion:
    Type: String
    Default: "18.3"
    Description: Aurora PostgreSQL engine version. Bump before each event.

  MinCapacity:
    Type: Number
    Default: 0
    Description: Min Serverless v2 ACU (0 = scale-to-zero).
    MinValue: 0
    MaxValue: 128

  MaxCapacity:
    Type: Number
    Default: 16
    Description: Max Serverless v2 ACU.
    MinValue: 0.5
    MaxValue: 128

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Pellier Aurora subnet group (${WorkshopId})
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Project
          Value: pellier
        - Key: Event
          Value: !Ref EventName

  ClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: !Sub Pellier Aurora cluster parameter group (${WorkshopId})
      Family: !Sub
        - aurora-postgresql${MajorVersion}
        - MajorVersion: !Select [0, !Split [".", !Ref AuroraEngineVersion]]
      # pgAudit: the library loads at start (a running cluster needs a writer reboot to pick
      # it up). Object auditing only: pgaudit.role names rds_pgaudit, the one value Aurora
      # allows, and the schema grants that role INSERT and UPDATE on pellier.store_credits,
      # so each credit write leaves one AUDIT line in the exported postgresql log; session
      # logging stays off. log_parameter adds the statement's bind values, the credit's
      # idempotency key among them.
      Parameters:
        shared_preload_libraries: pg_stat_statements,pgaudit
        pgaudit.role: rds_pgaudit
        pgaudit.log: none
        pgaudit.log_parameter: "1"
        rds.force_ssl: "1"
        search_path: '"$user", pellier, public'
      Tags:
        - Key: Project
          Value: pellier

  MasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub pellier-db-secret-${WorkshopId}
      Description: Aurora master credentials for Pellier
      GenerateSecretString:
        SecretStringTemplate: '{"username":"postgres"}'
        GenerateStringKey: password
        PasswordLength: 24
        # Decodes to: " @ / \ ' (double-quote, at, slash, backslash, single
        # quote). Does NOT exclude ':'. sample-pellier-agentic-search-apg's
        # scripts/bootstrap-labs.sh (governed branch) depends on this exact
        # set at two kinds of site: the .pgpass write escapes ':' and '\'
        # itself via pgpass_escape() rather than trusting this list (a colon
        # here is what caused per-deploy auth failures before that fix); the
        # .env write for DB_PASSWORD/PGPASSWORD uses bash's ${VAR@Q} quoting
        # and so does not depend on ' being excluded; the seeder/tool-registry
        # sudo -u ... bash -c calls pass DB_PASSWORD via `env NAME=value`
        # rather than string interpolation and so do not depend on it either.
        # If you ever add ':' back in or start allowing ', re-check those
        # sites (grep bootstrap-labs.sh for pgpass_escape and DB_PASSWORD).
        ExcludeCharacters: '"@/\'''
      Tags:
        - Key: Project
          Value: pellier
        - Key: Event
          Value: !Ref EventName

  # RDS creates this group without retention when it is absent, and pgAudit writes
  # bind parameters into it. Created first so the retention applies from the first line.
  PostgresqlLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/rds/cluster/pellier-cluster-${WorkshopId}/postgresql
      RetentionInDays: 30

  DBCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: PostgresqlLogGroup
    Properties:
      DBClusterIdentifier: !Sub pellier-cluster-${WorkshopId}
      DatabaseName: pellier
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      EngineMode: provisioned
      MasterUsername: !Sub "{{resolve:secretsmanager:${MasterSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${MasterSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AuroraSecurityGroupId
      DBClusterParameterGroupName: !Ref ClusterParameterGroup
      EnableIAMDatabaseAuthentication: true
      # RDS Data API. All four MCP-server Lambdas (search/pricing/recommendation/
      # experience) and the postgres-mcp-server rdsapi connection method reach
      # Aurora EXCLUSIVELY through rds-data — without this every Gateway-routed
      # tool call deploys fine but dies at invoke time with
      # HttpEndpointNotEnabledException (box-verified 2026-06-12; surfaced to the
      # participant only as the agent's vague "temporary database issue").
      # Supported for provisioned/Serverless v2 on aurora-postgresql >= 13.11.
      EnableHttpEndpoint: true
      BackupRetentionPeriod: 1
      StorageEncrypted: true
      # CloudWatch Database Insights, Advanced mode: per-query load, execution
      # plans and lock analysis, alongside the agents' spans in CloudWatch.
      # Advanced mode requires Performance Insights with 465-day retention.
      DatabaseInsightsMode: advanced
      PerformanceInsightsEnabled: true
      PerformanceInsightsRetentionPeriod: 465
      # The PostgreSQL log in CloudWatch Logs: a write row-level security
      # refuses is logged there as an ERROR ("new row violates row-level
      # security policy"). The default log line does not print the SQLSTATE.
      EnableCloudwatchLogsExports:
        - postgresql
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
      Tags:
        - Key: Project
          Value: pellier
        - Key: Event
          Value: !Ref EventName

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub pellier-writer-${WorkshopId}
      DBClusterIdentifier: !Ref DBCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      AutoMinorVersionUpgrade: true
      PubliclyAccessible: false
      Tags:
        - Key: Project
          Value: pellier

  SecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref MasterSecret
      TargetId: !Ref DBCluster
      TargetType: AWS::RDS::DBCluster

Outputs:
  ClusterEndpoint:
    Value: !GetAtt DBCluster.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-ClusterEndpoint
  ClusterPort:
    Value: !GetAtt DBCluster.Endpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-ClusterPort
  ClusterResourceId:
    Value: !GetAtt DBCluster.DBClusterResourceId
    Export:
      Name: !Sub ${AWS::StackName}-ClusterResourceId
  ClusterIdentifier:
    Value: !Ref DBCluster
    Export:
      Name: !Sub ${AWS::StackName}-ClusterIdentifier
  MasterSecretArn:
    Value: !Ref MasterSecret
    Export:
      Name: !Sub ${AWS::StackName}-MasterSecretArn
  DatabaseName:
    Value: pellier
    Export:
      Name: !Sub ${AWS::StackName}-DatabaseName
