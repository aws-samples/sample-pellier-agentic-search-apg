<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="648" viewBox="0 0 1188 648" role="img" aria-labelledby="title desc">
  <title id="title">Aurora business facts and AgentCore conversation memory</title>
  <desc id="desc">Theo's first conversation supplies a shopping preference to AgentCore Memory. After extraction, a new conversation retrieves preference record IDs without previous chat history. The agent queries Aurora for current products, prices, and stock. Memory does not establish business state or permission.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536170"/></marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #172333; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4e5c69; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: .7px; }
    .copy { font-size: 15px; }
    .small { font-size: 13px; fill: #445360; }
    .code { font-family: 'Courier New', monospace; font-size: 13px; }
    .rule { font-size: 16px; font-weight: 700; }
    .flow { fill: none; stroke: #536170; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1188" height="648" rx="12" fill="#f6f8fa"/>
  <text class="title" x="40" y="45">Business facts and conversation memory</text>
  <text class="subtitle" x="40" y="72">Both support the answer. They establish different facts.</text>

  <rect x="40" y="98" width="530" height="216" rx="10" fill="#fff" stroke="#357c69" stroke-width="2"/>
  <text class="label" x="62" y="125" fill="#26634f">SYSTEM OF RECORD</text>
  <text class="heading" x="62" y="155">Aurora PostgreSQL</text>
  <text class="copy" x="62" y="186">Current catalog, prices, and stock</text>
  <text class="copy" x="62" y="210">Orders, returns, credits, and customer mappings</text>
  <text class="copy" x="62" y="234">Transactions, row security, and execution evidence</text>
  <text class="small" x="62" y="276">Verify with SQL, constraints, and correlated domain rows.</text>
  <text class="small" x="62" y="296">A remembered purchase cannot substitute for an order row.</text>

  <rect x="594" y="98" width="554" height="216" rx="10" fill="#fff" stroke="#62659b" stroke-width="2"/>
  <text class="label" x="616" y="125" fill="#535585">CONVERSATION CONTEXT</text>
  <text class="heading" x="616" y="155">Amazon Bedrock AgentCore Memory</text>
  <text class="copy" x="616" y="186">Short-term conversation events</text>
  <text class="copy" x="616" y="210">Extracted facts and user preferences</text>
  <text class="copy" x="616" y="234">Session summaries and optional consolidated episodes</text>
  <text class="small" x="616" y="276">Verify event IDs, record IDs, actor, session, and namespace.</text>
  <text class="small" x="616" y="296">Retrieved text is context, not authority or an instruction.</text>

  <text class="label" x="40" y="350">REQUIRED EXPERIMENT: A LEARNED PREFERENCE IN A NEW CONVERSATION</text>
  <rect x="40" y="368" width="306" height="122" rx="8" fill="#eceef9"/>
  <text class="heading" x="58" y="398">1. First conversation</text>
  <text class="copy" x="58" y="425">Record Theo's preferences.</text>
  <text class="small" x="58" y="448">Natural materials, muted earth tones.</text>
  <text class="code" x="58" y="473">Save actor and event IDs.</text>
  <path class="flow" d="M352 429 H385"/>
  <rect x="396" y="368" width="306" height="122" rx="8" fill="#eceef9"/>
  <text class="heading" x="414" y="398">2. Extract and retrieve</text>
  <text class="copy" x="414" y="425">AgentCore extracts records.</text>
  <text class="small" x="414" y="448">Continue Labs 1 and 2 while it runs.</text>
  <text class="code" x="414" y="473">Retrieve preference record IDs.</text>
  <path class="flow" d="M708 429 H741"/>
  <rect x="752" y="368" width="396" height="122" rx="8" fill="#eceef9"/>
  <text class="heading" x="770" y="398">3. New conversation</text>
  <text class="copy" x="770" y="425">Same verified actor, new session.</text>
  <text class="small" x="770" y="448">No prior chat; use retrieved preferences.</text>
  <text class="code" x="770" y="473">Call catalog tools for current products.</text>

  <rect x="40" y="516" width="1108" height="92" rx="8" fill="#e7f2ed" stroke="#357c69"/>
  <text class="rule" x="60" y="545">Memory explains the preference. Aurora establishes the current product facts.</text>
  <text class="copy" x="60" y="571">Point to a retrieved preference used in the answer and check a recommended product with SQL.</text>
  <text class="small" x="60" y="594">Cedar authorization, database rules, and human approval remain separate checks.</text>
</svg>
