<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="610" viewBox="0 0 1188 610" role="img" aria-labelledby="title desc">
  <title id="title">Pellier managed execution and correlation path</title>
  <desc id="desc">An authenticated request moves from Pellier through the API, AgentCore Runtime, Gateway, Policy, Lambda tools, and Aurora while AgentCore Memory supplies session history.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#ff9900"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#3b82a0"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f7f8fa; }
    .title { fill: #161e2d; font: 700 29px Arial, sans-serif; }
    .subtitle { fill: #5f6b7a; font: 16px Arial, sans-serif; }
    .boundary { fill: #ffffff; stroke: #6b5b95; stroke-width: 2; stroke-dasharray: 8 6; }
    .boundary-label { fill: #5b4a84; font: 700 12px Arial, sans-serif; }
    .box { fill: #ffffff; stroke: #d5d9d9; stroke-width: 1.5; }
    .box-title { fill: #161e2d; font: 700 16px Arial, sans-serif; }
    .box-copy { fill: #3f4b5a; font: 13px Arial, sans-serif; }
    .box-code { fill: #5f6b7a; font: 12px "Courier New", monospace; }
    .step { fill: #232f3e; }
    .step-copy { fill: #ffffff; font: 700 12px Arial, sans-serif; }
    .flow { fill: none; stroke: #ff9900; stroke-width: 3; marker-end: url(#arrow); }
    .memory-flow { fill: none; stroke: #3b82a0; stroke-width: 2.5; stroke-dasharray: 6 5; marker-end: url(#arrow-blue); }
    .flow-label { fill: #5f6b7a; font: 11px Arial, sans-serif; }
    .receipt { fill: #232f3e; }
    .receipt-title { fill: #ffffff; font: 700 14px Arial, sans-serif; }
    .receipt-copy { fill: #d5dbdb; font: 13px "Courier New", monospace; }
    .proof { fill: #e7f4ea; stroke: #2f855a; stroke-width: 1.5; }
    .proof-copy { fill: #166534; font: 700 13px Arial, sans-serif; }
  </style>

  <rect class="bg" width="1188" height="610"/>
  <text class="title" x="42" y="48">Same dispatcher, managed execution boundary</text>
  <text class="subtitle" x="42" y="78">The orchestration pattern stays yours. Runtime changes where it runs; Gateway and Policy control how its tools execute.</text>

  <rect class="boundary" x="462" y="105" width="448" height="320" rx="8"/>
  <text class="boundary-label" x="482" y="128">AMAZON BEDROCK AGENTCORE</text>

  <g transform="translate(42 166)">
    <rect class="box" width="165" height="116" rx="8"/>
    <circle class="step" cx="27" cy="28" r="15"/>
    <text class="step-copy" x="27" y="32" text-anchor="middle">1</text>
    <text class="box-title" x="52" y="33">Pellier</text>
    <text class="box-copy" x="18" y="65">Authenticated request</text>
    <text class="box-code" x="18" y="88">Cognito JWT</text>
    <text class="box-code" x="18" y="106">session_id</text>
  </g>

  <g transform="translate(250 166)">
    <rect class="box" width="170" height="116" rx="8"/>
    <circle class="step" cx="27" cy="28" r="15"/>
    <text class="step-copy" x="27" y="32" text-anchor="middle">2</text>
    <text class="box-title" x="52" y="33">Pellier API</text>
    <text class="box-copy" x="18" y="65">Loads bounded history</text>
    <text class="box-copy" x="18" y="85">and invokes Runtime</text>
    <text class="box-code" x="18" y="106">prompt + history</text>
  </g>

  <g transform="translate(490 166)">
    <rect class="box" width="170" height="116" rx="8"/>
    <circle class="step" cx="27" cy="28" r="15"/>
    <text class="step-copy" x="27" y="32" text-anchor="middle">3</text>
    <text class="box-title" x="52" y="33">Runtime</text>
    <text class="box-copy" x="18" y="65">Hosts the same</text>
    <text class="box-copy" x="18" y="85">Pellier dispatcher</text>
    <text class="box-code" x="18" y="106">runtime request id</text>
  </g>

  <g transform="translate(705 166)">
    <rect class="box" width="170" height="116" rx="8"/>
    <circle class="step" cx="27" cy="28" r="15"/>
    <text class="step-copy" x="27" y="32" text-anchor="middle">4</text>
    <text class="box-title" x="52" y="33">Gateway</text>
    <text class="box-copy" x="18" y="65">Discovers 15 MCP tools</text>
    <text class="box-copy" x="18" y="85">with JWT passthrough</text>
    <text class="box-code" x="18" y="106">rail=gateway-mcp</text>
  </g>

  <g transform="translate(948 166)">
    <rect class="box" width="198" height="116" rx="8"/>
    <circle class="step" cx="27" cy="28" r="15"/>
    <text class="step-copy" x="27" y="32" text-anchor="middle">5</text>
    <text class="box-title" x="52" y="33">Lambda tools</text>
    <text class="box-copy" x="18" y="65">Search, pricing,</text>
    <text class="box-copy" x="18" y="85">recommend, experience</text>
    <text class="box-code" x="18" y="106">target-qualified MCP</text>
  </g>

  <path class="flow" d="M207 224 L244 224"/>
  <path class="flow" d="M420 224 L484 224"/>
  <path class="flow" d="M660 224 L699 224"/>
  <path class="flow" d="M875 224 L942 224"/>
  <text class="flow-label" x="427" y="211">Bearer token</text>
  <text class="flow-label" x="884" y="211">authorized call</text>

  <g transform="translate(490 323)">
    <rect class="box" width="170" height="78" rx="8"/>
    <text class="box-title" x="18" y="29">Memory</text>
    <text class="box-copy" x="18" y="52">Identity-scoped turns</text>
    <text class="box-code" x="18" y="69">actor + session</text>
  </g>

  <g transform="translate(705 323)">
    <rect class="box" width="170" height="78" rx="8"/>
    <text class="box-title" x="18" y="29">Policy</text>
    <text class="box-copy" x="18" y="52">Evaluates before target</text>
    <text class="box-code" x="18" y="69">ALLOW / DENY</text>
  </g>

  <g transform="translate(948 323)">
    <rect class="box" width="198" height="78" rx="8"/>
    <text class="box-title" x="18" y="29">Aurora PostgreSQL</text>
    <text class="box-copy" x="18" y="52">System of record</text>
    <text class="box-code" x="18" y="69">tool_audit + domain rows</text>
  </g>

  <path class="memory-flow" d="M335 282 L335 362 L484 362"/>
  <text class="flow-label" x="344" y="350">read and write turns</text>
  <path class="memory-flow" d="M790 282 L790 317"/>
  <path class="flow" d="M1047 282 L1047 317"/>

  <g transform="translate(42 462)">
    <rect class="receipt" width="1104" height="74" rx="8"/>
    <text class="receipt-title" x="24" y="27">CORRELATION CONTRACT</text>
    <text class="receipt-copy" x="215" y="27">principal_id | session_id | turn_id | runtime_request_id | receipt_id | audit_id</text>
    <text class="receipt-copy" x="24" y="53">Identity follows the request; correlation joins policy, execution, and data evidence after the turn.</text>
  </g>

  <g transform="translate(42 553)">
    <rect class="proof" width="1104" height="36" rx="8"/>
    <text class="proof-copy" x="20" y="23">LIVE CHECKPOINT: Runtime ready + 15 Gateway tools + Memory ACTIVE + rail=gateway-mcp + JWT passthrough</text>
  </g>
</svg>
