    .active-2 #lab-2 .card,
    .active-3 #lab-3 .card,
    .active-4 #lab-4 .card {
      fill: #f1e3d6;
      stroke: #9a3412;
      stroke-width: 2.6;
    }

    .active-1 #lab-1 .accent,
    .active-2 #lab-2 .accent,
    .active-3 #lab-3 .accent,
    .active-4 #lab-4 .accent {
