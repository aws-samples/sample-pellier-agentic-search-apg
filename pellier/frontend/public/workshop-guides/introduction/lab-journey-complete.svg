    .active-3 #lab-1 .number,
    .active-3 #lab-2 .number,
    .active-4 #lab-1 .number,
    .active-4 #lab-2 .number,
    .active-4 #lab-3 .number,
    .complete #lab-1 .number,
    .complete #lab-2 .number,
    .complete #lab-3 .number,
    .complete #lab-4 .number {
