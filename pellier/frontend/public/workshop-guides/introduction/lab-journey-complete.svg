  <rect width="1188" height="405" fill="#f7f3ec"/>

  <g class="overview-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Introduction, four labs, and Summary</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">Each lab ends with evidence you can state, show, or query.</text>
  </g>
  <g class="start-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Introduction</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">Check the starting state and record Theo's first conversation before Lab 1.</text>
  </g>
  <g class="complete-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Summary</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">Explain what your saved evidence establishes and which checks still need investigation.</text>
  </g>
  <g class="lab-1-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Lab 1 of 4</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">You are here: Build a PostgreSQL-Grounded Agent. Finish this proof before moving on.</text>
  </g>
  <g class="lab-2-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Lab 2 of 4</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">You are here: Build and Measure PostgreSQL Hybrid Retrieval. Finish this proof before moving on.</text>
  </g>
  <g class="lab-3-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Lab 3 of 4</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">You are here: Deploy and Operate Agents with Amazon Bedrock AgentCore. Complete the checks before moving on.</text>
  </g>
  <g class="lab-4-title">
    <text x="48" y="43" font-size="24" font-weight="700" fill="#1f1d1a">Lab 4 of 4</text>
    <text x="48" y="69" font-size="13.5" fill="#6b665d">You are here: Build Governed Agent Actions with Cedar. Complete the checks before moving on.</text>
  </g>

  <g id="lab-1">
    <rect class="card" x="48" y="91" width="255" height="244" rx="8" fill="#fbf8f2" stroke="#9a3412" stroke-width="1.6"/>
    <rect class="accent" x="48" y="91" width="255" height="7" rx="3.5" fill="#9a3412"/>
    <circle class="number" cx="76" cy="128" r="17" fill="#1d1512"/>
    <text x="76" y="134" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text class="overview-only" x="104" y="133" font-size="10.5" font-weight="700" fill="#9a3412">LAB 1: BUILD</text>
    <text class="done-only" x="104" y="133" font-size="10.5" font-weight="700" fill="#9a3412">COMPLETE</text>
    <text class="active-only" x="104" y="133" font-size="10.5" font-weight="700" fill="#9a3412">YOU ARE HERE</text>
    <text class="future-only" x="104" y="133" font-size="10.5" font-weight="700" fill="#6b665d">UPCOMING</text>
    <text x="72" y="163" font-size="10.5" font-weight="700" fill="#9a3412">MARCO / AURORA ROW</text>
    <text x="72" y="188" font-size="17" font-weight="700" fill="#1f1d1a">Build a PostgreSQL-</text>
    <text x="72" y="209" font-size="17" font-weight="700" fill="#1f1d1a">Grounded Agent</text>
    <text x="72" y="232" font-size="12.5" fill="#6b665d">Prove inventory from Aurora.</text>
    <line x1="72" y1="251" x2="279" y2="251" stroke="#ded8ce" stroke-width="1"/>
    <text x="72" y="274" font-size="10.5" font-weight="700" fill="#9a3412">DONE WHEN</text>
    <text x="72" y="302" font-size="12.5" font-weight="600" fill="#1f1d1a">Live inventory and audit row</text>
  </g>

  <g id="lab-2">
    <rect class="card" x="327" y="91" width="255" height="244" rx="8" fill="#fbf8f2" stroke="#9a3412" stroke-width="1.6"/>
    <rect class="accent" x="327" y="91" width="255" height="7" rx="3.5" fill="#9a3412"/>
    <circle class="number" cx="355" cy="128" r="17" fill="#1d1512"/>
    <text x="355" y="134" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text class="overview-only" x="383" y="133" font-size="10.5" font-weight="700" fill="#9a3412">LAB 2: BUILD + MEASURE</text>
    <text class="done-only" x="383" y="133" font-size="10.5" font-weight="700" fill="#9a3412">COMPLETE</text>
    <text class="active-only" x="383" y="133" font-size="10.5" font-weight="700" fill="#9a3412">YOU ARE HERE</text>
    <text class="future-only" x="383" y="133" font-size="10.5" font-weight="700" fill="#6b665d">UPCOMING</text>
    <text x="351" y="163" font-size="10.5" font-weight="700" fill="#9a3412">ANNA / RRF + GOLDEN SET</text>
    <text x="351" y="182" font-size="16" font-weight="700" fill="#1f1d1a">Build and Measure</text>
    <text x="351" y="201" font-size="16" font-weight="700" fill="#1f1d1a">PostgreSQL Hybrid</text>
    <text x="351" y="220" font-size="16" font-weight="700" fill="#1f1d1a">Retrieval</text>
    <text x="351" y="240" font-size="12.5" fill="#6b665d">Compare quality, time, and cost.</text>
    <line x1="351" y1="251" x2="558" y2="251" stroke="#ded8ce" stroke-width="1"/>
    <text x="351" y="274" font-size="10.5" font-weight="700" fill="#9a3412">DONE WHEN</text>
    <text x="351" y="302" font-size="12.5" font-weight="600" fill="#1f1d1a">Defend one strategy choice</text>
  </g>

  <g id="lab-3">
    <rect class="card" x="606" y="91" width="255" height="244" rx="8" fill="#fbf8f2" stroke="#9a3412" stroke-width="1.6"/>
    <rect class="accent" x="606" y="91" width="255" height="7" rx="3.5" fill="#9a3412"/>
    <circle class="number" cx="634" cy="128" r="17" fill="#1d1512"/>
    <text x="634" y="134" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text class="overview-only" x="662" y="133" font-size="10.5" font-weight="700" fill="#9a3412">LAB 3: DEPLOY + OPERATE</text>
    <text class="done-only" x="662" y="133" font-size="10.5" font-weight="700" fill="#9a3412">COMPLETE</text>
    <text class="active-only" x="662" y="133" font-size="10.5" font-weight="700" fill="#9a3412">YOU ARE HERE</text>
    <text class="future-only" x="662" y="133" font-size="10.5" font-weight="700" fill="#6b665d">UPCOMING</text>
    <text x="630" y="163" font-size="10.5" font-weight="700" fill="#9a3412">THEO / AGENTCORE</text>
    <text x="630" y="182" font-size="16" font-weight="700" fill="#1f1d1a">Deploy and Operate</text>
    <text x="630" y="201" font-size="16" font-weight="700" fill="#1f1d1a">Agents with Amazon</text>
    <text x="630" y="220" font-size="16" font-weight="700" fill="#1f1d1a">Bedrock AgentCore</text>
    <text x="630" y="240" font-size="12.5" fill="#6b665d">Deploy, remember, and trace.</text>
    <line x1="630" y1="251" x2="837" y2="251" stroke="#ded8ce" stroke-width="1"/>
    <text x="630" y="274" font-size="10.5" font-weight="700" fill="#9a3412">DONE WHEN</text>
    <text x="630" y="294" font-size="12.5" font-weight="600" fill="#1f1d1a">Verify build and learned context</text>
    <text x="630" y="313" font-size="12.5" font-weight="600" fill="#1f1d1a">Read Memory and trace records</text>
  </g>

  <g id="lab-4">
    <rect class="card" x="885" y="91" width="255" height="244" rx="8" fill="#fbf8f2" stroke="#9a3412" stroke-width="1.6"/>
    <rect class="accent" x="885" y="91" width="255" height="7" rx="3.5" fill="#9a3412"/>
    <circle class="number" cx="913" cy="128" r="17" fill="#1d1512"/>
    <text x="913" y="134" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text class="overview-only" x="941" y="133" font-size="10.5" font-weight="700" fill="#9a3412">LAB 4: GOVERN</text>
    <text class="done-only" x="941" y="133" font-size="10.5" font-weight="700" fill="#9a3412">COMPLETE</text>
    <text class="active-only" x="941" y="133" font-size="10.5" font-weight="700" fill="#9a3412">YOU ARE HERE</text>
    <text class="future-only" x="941" y="133" font-size="10.5" font-weight="700" fill="#6b665d">UPCOMING</text>
    <text x="909" y="163" font-size="10.5" font-weight="700" fill="#9a3412">JESSICA / CEDAR + RLS</text>
    <text x="909" y="188" font-size="17" font-weight="700" fill="#1f1d1a">Build Governed Agent</text>
    <text x="909" y="209" font-size="17" font-weight="700" fill="#1f1d1a">Actions with Cedar</text>
    <text x="909" y="232" font-size="12.5" fill="#6b665d">Bind caller identity to input.</text>
    <line x1="909" y1="251" x2="1116" y2="251" stroke="#ded8ce" stroke-width="1"/>
    <text x="909" y="274" font-size="10.5" font-weight="700" fill="#9a3412">DONE WHEN</text>
    <text x="909" y="294" font-size="12.5" font-weight="600" fill="#1f1d1a">DENY leaves no tool row</text>
    <text x="909" y="313" font-size="12.5" font-weight="600" fill="#1f1d1a">Valid return commits once</text>
  </g>

  <line x1="306" y1="213" x2="318" y2="213" stroke="#9a3412" stroke-width="2.2" marker-end="url(#journey-arrow)"/>
  <line x1="585" y1="213" x2="597" y2="213" stroke="#9a3412" stroke-width="2.2" marker-end="url(#journey-arrow)"/>
  <line x1="864" y1="213" x2="876" y2="213" stroke="#9a3412" stroke-width="2.2" marker-end="url(#journey-arrow)"/>

  <text x="48" y="374" font-size="11.5" font-weight="700" fill="#9a3412">INTRODUCTION</text>
  <line x1="143" y1="370" x2="980" y2="370" stroke="#9a3412" stroke-width="2" opacity="0.45"/>
  <circle cx="143" cy="370" r="4" fill="#9a3412"/>
  <circle cx="443" cy="370" r="4" fill="#9a3412"/>
  <circle cx="743" cy="370" r="4" fill="#9a3412"/>
  <circle cx="980" cy="370" r="4" fill="#9a3412"/>
  <text x="1140" y="374" font-size="11.5" font-weight="700" fill="#9a3412" text-anchor="end">SUMMARY</text>
