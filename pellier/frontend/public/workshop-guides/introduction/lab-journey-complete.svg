<svg class="complete" xmlns="http://www.w3.org/2000/svg" width="1188" height="405" viewBox="0 0 1188 405" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Completed four-lab journey</title>
  <desc>All four labs are marked complete, from building the inventory path through enforcing policy.</desc>
  <defs>
    <marker id="journey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <style>
    .overview-title,
    .start-title,
    .complete-title,
    .lab-1-title,
    .lab-2-title,
    .lab-3-title,
    .lab-4-title,
    .overview-only,
    .done-only,
    .active-only,
    .future-only {
      display: none;
    }

    .overview .overview-title,
    .overview .overview-only,
    .start .start-title,
    .complete .complete-title,
    .active-1 .lab-1-title,
    .active-2 .lab-2-title,
    .active-3 .lab-3-title,
    .active-4 .lab-4-title {
      display: block;
    }

    .active-1 #lab-1 .active-only,
    .active-2 #lab-2 .active-only,
    .active-3 #lab-3 .active-only,
    .active-4 #lab-4 .active-only {
      display: block;
    }

    .active-2 #lab-1 .done-only,
    .active-3 #lab-1 .done-only,
    .active-3 #lab-2 .done-only,
    .active-4 #lab-1 .done-only,
    .active-4 #lab-2 .done-only,
    .active-4 #lab-3 .done-only,
    .complete #lab-1 .done-only,
    .complete #lab-2 .done-only,
    .complete #lab-3 .done-only,
    .complete #lab-4 .done-only {
      display: block;
    }

    .active-1 #lab-2 .future-only,
    .active-1 #lab-3 .future-only,
    .active-1 #lab-4 .future-only,
    .active-2 #lab-3 .future-only,
    .active-2 #lab-4 .future-only,
    .active-3 #lab-4 .future-only,
    .start #lab-1 .future-only,
    .start #lab-2 .future-only,
    .start #lab-3 .future-only,
    .start #lab-4 .future-only {
      display: block;
    }

    .start .card,
    .complete .card,
    .active-1 .card,
    .active-2 .card,
    .active-3 .card,
    .active-4 .card {
      fill: #fbf8f2;
      stroke: #c9b8aa;
      stroke-width: 1.3;
    }

    .start .accent,
    .complete .accent,
    .active-1 .accent,
    .active-2 .accent,
    .active-3 .accent,
    .active-4 .accent {
      fill: #dccbb2;
    }

    .start .number,
    .complete .number,
    .active-1 .number,
    .active-2 .number,
    .active-3 .number,
    .active-4 .number {
      fill: #6b665d;
    }

    .active-2 #lab-1 .card,
    .active-3 #lab-1 .card,
    .active-3 #lab-2 .card,
    .active-4 #lab-1 .card,
    .active-4 #lab-2 .card,
    .active-4 #lab-3 .card,
    .complete #lab-1 .card,
    .complete #lab-2 .card,
    .complete #lab-3 .card,
    .complete #lab-4 .card {
      fill: #fbf8f2;
      stroke: #9a3412;
      stroke-width: 1.6;
    }

    .active-2 #lab-1 .accent,
    .active-3 #lab-1 .accent,
    .active-3 #lab-2 .accent,
    .active-4 #lab-1 .accent,
    .active-4 #lab-2 .accent,
    .active-4 #lab-3 .accent,
    .complete #lab-1 .accent,
    .complete #lab-2 .accent,
    .complete #lab-3 .accent,
    .complete #lab-4 .accent {
      fill: #9a3412;
    }

