<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Pellier | Your Personal Shopping Concierge</title>
    <meta
      name="description"
      content="Discover considered fashion, gifts, and home pieces with a personal shopping concierge that remembers your taste and checks live availability."
    />
    <!-- Typefaces are self-hosted via @fontsource packages and imported
         from src/main.tsx so they bundle into dist/assets/. No Google
         Fonts runtime dependency — the workshop runs unchanged on
         corporate networks that block fonts.gstatic.com. -->
    <!-- The theme before first paint. Mirrors src/theme/theme.ts: the stored
         choice under `pellier-theme` ('light' or 'dark'), otherwise the system
         preference. Storage may be absent or throw, so it is wrapped. -->
    <script id="pellier-theme-script">
      (function () {
        var choice = null;
        try { choice = window.localStorage.getItem('pellier-theme'); } catch (e) {}
        if (choice !== 'light' && choice !== 'dark') {
          var dark = false;
          try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
          choice = dark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', choice);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
