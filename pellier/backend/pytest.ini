[pytest]
testpaths = tests

filterwarnings =
    # Starlette 0.50+ deprecates per-request `cookies=` kwargs on TestClient
    # calls in favor of `client.cookies = {...}`. Our tests intentionally
    # scope the cookie to a single request (auth state varies per call), so
    # silence this one deprecation rather than rewrite every call site.
    ignore:Setting per-request cookies.*:DeprecationWarning:starlette.*
    # bedrock-agentcore's RequestContext (runtime/context.py) declares a
    # class-based pydantic `Config`, deprecated since Pydantic 2.0. Upstream
    # main (1.24.0) still does, so it cannot be fixed from this repository.
    # Scoped to that SDK module so the same deprecation in Pellier's own
    # models still surfaces.
    ignore::pydantic.warnings.PydanticDeprecatedSince20:bedrock_agentcore.runtime.context
