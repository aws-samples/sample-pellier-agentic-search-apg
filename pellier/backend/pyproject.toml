[project]
name = "pellier-backend"
version = "0.1.0"
description = "Pellier agentic search backend — also the AgentCore Runtime BYO code-location."
requires-python = ">=3.12"

# Dependencies for the AgentCore Runtime CodeZip build. The renderer stages this
# file with uv.lock; requirements.txt is not part of the managed bundle. Keep the
# list limited to imports reachable from agentcore_runtime.py: the Runtime calls
# Gateway tools and never imports the database-bound FastAPI application.
dependencies = [
    "strands-agents[otel]",
    "aws-opentelemetry-distro>=0.18.0",
    "mcp>=1.0.0",
    "httpx>=0.28.1",
    "bedrock-agentcore>=1.4.3",
    "PyJWT[crypto]>=2.15.1",
]

[tool.uv]
# Keep transitive authentication and HTTP dependencies above the same security
# floors as the database-bound application without adding Runtime import roots.
constraint-dependencies = ["PyJWT>=2.15.1", "urllib3>=2.8.0"]
