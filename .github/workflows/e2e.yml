# Always-running production-build browser gate for the participant path.
#
# Smoke mode replaces external Aurora and Bedrock calls with deterministic
# responses, but the frontend is the real production bundle served by FastAPI.
# This gate needs no AWS credentials and cannot pass by skipping its tests.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Production-build participant smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      PELLIER_SMOKE_MODE: "true"
      DB_HOST: localhost
      DB_NAME: pellier_smoke
      DB_USER: pellier_smoke
      DB_PASSWORD: pellier_smoke
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      E2E_BASE_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: pellier/frontend
        run: npm ci

      - name: Build frontend
        working-directory: pellier/frontend
        run: npm run build

      - name: Install backend deps
        working-directory: pellier/backend
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install Playwright browsers
        working-directory: pellier/frontend
        run: npx playwright install --with-deps chromium

      - name: Start production server
        working-directory: pellier/backend
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 >/tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sSf http://localhost:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "backend did not start in time" >&2
          cat /tmp/backend.log >&2
          exit 1

      - name: Run participant smoke specs
        working-directory: pellier/frontend
        run: |
          npx playwright test \
            e2e/workshop-smoke.spec.ts \
            e2e/persona-modal.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: participant-smoke-report-ubuntu-latest
          path: pellier/frontend/playwright-report
          if-no-files-found: ignore
