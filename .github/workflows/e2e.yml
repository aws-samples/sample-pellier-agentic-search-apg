name: fresh-deployment-e2e

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Fresh Workshop Studio deployment URL, without a trailing slash
        required: true
        type: string
      boundary_run:
        description: Completed five-outcome boundary proof run from this deployment
        required: true
        type: string

concurrency:
  group: fresh-deployment-e2e-${{ inputs.base_url }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Real Workshop Studio deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: workshop-e2e
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ALLOWED_BASE_URL: ${{ vars.E2E_ALLOWED_BASE_URL }}
      E2E_BOUNDARY_RUN: ${{ inputs.boundary_run }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      E2E_GOVERN_USERNAME: ${{ secrets.E2E_GOVERN_USERNAME }}
      E2E_GOVERN_PASSWORD: ${{ secrets.E2E_GOVERN_PASSWORD }}
      E2E_OPERATOR_USERNAME: ${{ secrets.E2E_OPERATOR_USERNAME }}
      E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check approved deployment and required live inputs
        run: python3 tests/e2e/validate_deployment_inputs.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: pellier/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: pellier/frontend
        run: npx playwright install --with-deps chromium

      - name: Run real deployment E2E
        working-directory: pellier/frontend
        run: |
          npx playwright test \
            e2e/workshop-smoke.spec.ts \
            e2e/persona-modal.spec.ts \
            e2e/govern-reference.spec.ts \
            e2e/resolution-trace.spec.ts \
            e2e/workbench-live.spec.ts \
            e2e/cognito \
            e2e/operator-client-preview.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-deployment-e2e-report
          path: pellier/frontend/playwright-report
          if-no-files-found: ignore
