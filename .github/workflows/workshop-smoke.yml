# Workshop smoke: manual cross-platform production-build E2E on macOS.
#
# Goal: give facilitators a manual readiness check before workshop delivery.
# e2e.yml runs the same participant gate automatically on Ubuntu. This manual
# macOS check gives facilitators a second platform before workshop delivery.
#
# The specs run without Cognito or AWS credentials. The real-query
# check accepts the app's graceful fallback response when Bedrock is
# not available.

name: workshop-smoke

on:
  workflow_dispatch: {}

concurrency:
  group: workshop-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: macos-latest production-build smoke
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PELLIER_SMOKE_MODE: "true"
      DB_HOST: localhost
      DB_NAME: pellier_smoke
      DB_USER: pellier_smoke
      DB_PASSWORD: pellier_smoke
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: pellier/frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: pellier/frontend
        run: npm run build

      - name: Install backend deps
        working-directory: pellier/backend
        run: python -m pip install -r requirements.lock

      - name: Install Playwright browsers
        working-directory: pellier/frontend
        run: npx playwright install --with-deps chromium

      # Launch uvicorn in the background for the Playwright smoke specs.
      - name: Start uvicorn
        working-directory: pellier/backend
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sSf http://localhost:8000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "uvicorn did not start"; cat /tmp/uvicorn.log; exit 1

      - name: Run Playwright smoke specs
        working-directory: pellier/frontend
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          npx playwright test \
            e2e/workshop-smoke.spec.ts \
            e2e/persona-modal.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workshop-smoke-report-macos-latest
          path: pellier/frontend/playwright-report
          if-no-files-found: ignore
