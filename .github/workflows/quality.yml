name: governed-quality

on:
  push:
    branches: [governed]
  pull_request:
    branches: [governed]
  workflow_dispatch: {}

concurrency:
  group: governed-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      DB_NAME: pellier_test
      DB_USER: pellier_test
      DB_PASSWORD: pellier_test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pellier/backend/requirements.lock

      - name: Install backend dependencies
        working-directory: pellier/backend
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run backend tests
        working-directory: pellier/backend
        run: python -m pytest -q

      # The box installs requirements.lock, and every AgentCore deploy builds the Runtime
      # from uv.lock (UV_CONSTRAINT), so a known vulnerability in either reaches an event.
      - name: Audit the locked Python dependencies
        working-directory: pellier/backend
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --disable-pip --require-hashes -r requirements.lock
          python - > "$RUNNER_TEMP/runtime-lock.txt" <<'PY'
          import tomllib
          for package in tomllib.load(open("uv.lock", "rb"))["package"]:
              if "virtual" not in package.get("source", {}):
                  print(f"{package['name']}=={package['version']}")
          PY
          # GHSA-xcq7-p3pf-p88h (opentelemetry-api tracestate parsing): every
          # aws-opentelemetry-distro release pins opentelemetry-api below the fix,
          # 1.45.1. Drop this once a distro release allows it, then relock.
          # GHSA-f5m9-jfrj-jjj7 (opentelemetry-propagator-jaeger baggage parsing): the
          # distro pins the propagator at 1.44.0, below the fix, 1.45.0, through
          # 0.21.0. Nothing sets OTEL_PROPAGATORS and the distro's default is
          # baggage,xray,tracecontext, so the Jaeger parser never loads. Drop it on
          # the same terms as the line above.
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/runtime-lock.txt" \
            --ignore-vuln GHSA-xcq7-p3pf-p88h --ignore-vuln GHSA-f5m9-jfrj-jjj7

      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # Deploy and lab-check scripts run on a provisioned box, not under the test
      # suite, so an unbound name there surfaces only during a deploy.
      - name: Check scripts for undefined names
        run: pipx run ruff==0.16.10 check --select F821 scripts/ deploy/

      # The own-account path deploys these templates straight from the repository, and
      # the Workshop Studio repo copies them at each repin.
      - name: Lint the CloudFormation templates
        run: pipx run cfn-lint==1.59.0 deploy/own-account/templates/*.yml

  backend-postgres:
    name: PostgreSQL-backed backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      # fresh_cluster.py fails instead of skipping when no cluster is found, so the
      # row-level security, credit replay, lab reset and fresh-setup proofs cannot
      # pass by not running.
      PELLIER_REQUIRE_POSTGRES: "1"
      PG_BIN: /usr/lib/postgresql/18/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pellier/backend/requirements.lock

      - name: Install backend dependencies
        working-directory: pellier/backend
        run: python -m pip install --require-hashes -r requirements.lock

      # The workshop runs Aurora PostgreSQL 18 with pgvector; the tests start their own
      # throwaway cluster from these binaries and run scripts/setup/database-setup.sh.
      - name: Install PostgreSQL 18 and pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-18-pgvector
          sudo systemctl stop postgresql || true
          test -f "$PG_BIN/initdb"
          test -f "$("$PG_BIN/pg_config" --sharedir)/extension/vector.control"

      # Every test module that starts the cluster, plus the take-home package's SQL
      # proof, which lives beside the scripts and is outside pytest.ini's testpaths.
      - name: Run the PostgreSQL-backed tests
        working-directory: pellier/backend
        run: |
          python -m pytest -q -rs \
            $(grep -l 'fresh_cluster' tests/*.py) \
            ../../scripts/test_takeaway_package.py

  frontend:
    name: Frontend tests, build, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: pellier/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: pellier/frontend
        run: npm test -- --run

      - name: Type-check
        working-directory: pellier/frontend
        run: npm run type-check

      - name: Lint
        working-directory: pellier/frontend
        run: npm run lint

      - name: Build
        working-directory: pellier/frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: pellier/frontend
        run: npm audit --omit=dev --audit-level=high

      # A box writes the CDK project with the pinned CLI, copies in this lockfile and runs
      # npm ci, which refuses a lockfile outside the scaffold's ranges. A lockfile patched
      # on its own, such as a newer aws-cdk-lib, fails here instead of on an event box.
      - name: Install the locked AgentCore CDK project as a box does
        run: |
          scaffold="$RUNNER_TEMP/agentcore-scaffold"
          mkdir -p "$scaffold"
          npx -y @aws/agentcore@0.29.0 create --project-name lockcheck --no-agent \
            --skip-git --skip-python-setup --skip-install --output-dir "$scaffold" --json
          cdk="$scaffold/lockcheck/agentcore/cdk"
          diff scripts/deploy/agentcore-cdk-0.29.0/package.json "$cdk/package.json"
          cp scripts/deploy/agentcore-cdk-0.29.0/package-lock.json "$cdk/"
          (cd "$cdk" && npm ci --no-audit --no-fund)

      # Every AgentCore deploy installs this locked CDK tree, the aws-cdk CLI included.
      - name: Audit the locked AgentCore CDK dependencies
        working-directory: scripts/deploy/agentcore-cdk-0.29.0
        run: |
          # The five GHSAs below are brace-expansion 5.0.6, bundled inside aws-cdk-lib
          # 2.261.0, the only release the CLI's ~2.261.0 allows. aws-cdk-lib expands
          # glob patterns from the CDK app and its asset ignore files, which this
          # repository and the CLI write; no participant or shopper input reaches them.
          # Drop them when a pinned AgentCore CLI vends an aws-cdk-lib that bundles
          # brace-expansion 5.0.12 or newer, then relock.
          npm audit --json | python3 ../npm_audit_gate.py \
            --ignore GHSA-3jxr-9vmj-r5cp --ignore GHSA-mh99-v99m-4gvg \
            --ignore GHSA-rgw5-rvv9-x895 --ignore GHSA-qhr7-859c-m2p7 \
            --ignore GHSA-6j4f-fj2g-mc7p

  browser:
    name: Browser tests against a stand-in API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pellier/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # These specs answer every /api call with an in-test stand-in, so they need
      # the app on Vite and nothing from AWS. workshop-smoke and retail-journey
      # need a deployment; the *-screenshots specs only produce captures.
      - name: Start the app on Vite
        run: |
          npx vite --port 5199 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:5199/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Run browser tests
        env:
          E2E_BASE_URL: http://localhost:5199
        run: >-
          npx playwright test --workers=2
          e2e/shopper-sign-in.spec.ts
          e2e/first-visit-tour.spec.ts
          e2e/two-sessions.spec.ts
          e2e/live-turn-trace.spec.ts
          e2e/operator-execution-states.spec.ts
