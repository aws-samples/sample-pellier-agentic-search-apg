name: quality

# Unit, static-analysis, build, and dependency gate for `main`.
# The production participant path is exercised separately by e2e.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tests/conftest.py pins hermetic settings, so the suite does not need DB
    # credentials. AWS_REGION stays set because some modules read it at import
    # time, and a runner has no ambient region.
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pellier/backend/requirements.lock

      - name: Install backend dependencies
        working-directory: pellier/backend
        run: python -m pip install -r requirements.lock

      - name: Run backend tests
        working-directory: pellier/backend
        run: python -m pytest -q

      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  frontend:
    name: Frontend tests, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: pellier/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: pellier/frontend
        run: npm test -- --run

      - name: Type-check
        working-directory: pellier/frontend
        run: npm run type-check

      - name: Lint
        working-directory: pellier/frontend
        run: npm run lint

      - name: Build
        working-directory: pellier/frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: pellier/frontend
        run: npm audit --omit=dev --audit-level=high
