name: governed-quality

on:
  push:
    branches: [governed]
  pull_request:
    branches: [governed]
  workflow_dispatch: {}

concurrency:
  group: governed-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      DB_NAME: pellier_test
      DB_USER: pellier_test
      DB_PASSWORD: pellier_test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pellier/backend/requirements.lock

      - name: Install backend dependencies
        working-directory: pellier/backend
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run backend tests
        working-directory: pellier/backend
        run: python -m pytest -q

      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # Deploy and lab-check scripts run on a provisioned box, not under the test
      # suite, so an unbound name there surfaces only during a deploy.
      - name: Check scripts for undefined names
        run: pipx run ruff==0.16.10 check --select F821 scripts/

  frontend:
    name: Frontend tests, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: pellier/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: pellier/frontend
        run: npm test -- --run

      - name: Type-check
        working-directory: pellier/frontend
        run: npm run type-check

      - name: Lint
        working-directory: pellier/frontend
        run: npm run lint

      - name: Build
        working-directory: pellier/frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: pellier/frontend
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser tests against a stand-in API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pellier/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # These specs answer every /api call with an in-test stand-in, so they need
      # the app on Vite and nothing from AWS. workshop-smoke and retail-journey
      # need a deployment; the *-screenshots specs only produce captures.
      - name: Start the app on Vite
        run: |
          npx vite --port 5199 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:5199/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Run browser tests
        env:
          E2E_BASE_URL: http://localhost:5199
        run: >-
          npx playwright test --workers=2
          e2e/shopper-sign-in.spec.ts
          e2e/first-visit-tour.spec.ts
          e2e/two-sessions.spec.ts
          e2e/live-turn-trace.spec.ts
          e2e/operator-execution-states.spec.ts
